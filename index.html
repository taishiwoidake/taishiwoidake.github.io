<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Ryunosuke Hirata — 平田隆之介">
  <title>Ryunosuke Hirata</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #fff;
      color: #111;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main { text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6.2vw, 5.5rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.12;
    }
    p {
      margin: 1.25rem 0 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.24em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ryunosuke Hirata</h1>
    <p lang="ja">平田隆之介</p>
  </main>
</body>
</html>
